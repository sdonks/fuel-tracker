<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Benzină</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f; --surface: #161618; --surface2: #1e1e21;
    --border: rgba(255,255,255,0.07); --border-accent: rgba(220,30,30,0.4);
    --red: #DC1E1E; --cyan: #00AACC; --cyan-dim: rgba(0,170,204,0.1);
    --text: #f0f0f0; --text-muted: #888; --text-dim: #555;
    --mono: 'DM Mono', monospace; --sans: 'Syne', sans-serif; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 560px; margin: 0 auto; }
  header { margin-bottom: 2.5rem; }
  header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  header h1 span { color: var(--red); }
  header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.4rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; }
  .card-title { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 1.2rem; }
  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.4rem; }
  .field input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: var(--mono);
    font-size: 0.95rem; padding: 0.65rem 0.85rem; outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--cyan); }
  .field input::placeholder { color: var(--text-dim); }
  .dist-row {
    display: flex; align-items: center; gap: 0.6rem;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.65rem 0.85rem; margin-top: 0.75rem;
    font-family: var(--mono); font-size: 0.82rem; min-height: 42px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .dot.loading { background: var(--cyan); }
  .dot.ok { background: #22c55e; }
  .dot.error { background: var(--red); }
  .dist-text { color: var(--text-muted); flex: 1; }
  .dist-val { color: var(--cyan); font-weight: 500; }
  .fuel-status {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem;
    background: var(--surface2); border-radius: 6px; border: 1px solid var(--border);
    font-family: var(--mono); font-size: 0.82rem;
  }
  .fuel-label { color: var(--text-muted); flex: 1; }
  .fuel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.75rem; }
  .fuel-option {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.65rem 0.5rem; cursor: pointer;
    text-align: center; transition: border-color 0.15s, background 0.15s;
  }
  .fuel-option:hover { border-color: rgba(220,30,30,0.4); }
  .fuel-option.selected { border-color: var(--cyan); background: var(--cyan-dim); }
  .fuel-option .station { font-size: 0.72rem; color: var(--text-muted); }
  .fuel-option .price { font-family: var(--mono); font-size: 0.9rem; color: var(--text); margin-top: 0.2rem; }
  .fuel-option.selected .price { color: var(--cyan); }
  .status-row { display: flex; align-items: center; margin-bottom: 0.6rem; }
  .status-row .card-title { margin-bottom: 0; }
  .refresh-btn {
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--text-muted); font-family: var(--sans); font-size: 0.72rem;
    padding: 0.25rem 0.6rem; cursor: pointer; margin-left: auto;
  }
  .refresh-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn-calc {
    width: 100%; background: var(--red); color: #fff; border: none;
    border-radius: var(--radius); font-family: var(--sans); font-size: 0.95rem;
    font-weight: 700; letter-spacing: 0.05em; padding: 0.85rem; cursor: pointer;
    margin-top: 0.5rem; transition: opacity 0.15s, transform 0.1s;
  }
  .btn-calc:hover { opacity: 0.88; }
  .btn-calc:active { transform: scale(0.98); }
  .error-msg { font-size: 0.8rem; color: var(--red); padding: 0.5rem 0; display: none; }
  .error-msg.show { display: block; }
  .result { display: none; background: var(--surface); border: 1px solid var(--border-accent); border-radius: var(--radius); padding: 1.5rem; margin-top: 1rem; }
  .result.show { display: block; }
  .result-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.3rem; }
  .result-main { font-size: 2.6rem; font-weight: 700; color: var(--red); letter-spacing: -0.04em; font-family: var(--mono); }
  .result-details { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .d-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .d-val { font-family: var(--mono); font-size: 0.95rem; color: var(--text-muted); margin-top: 0.15rem; }
  footer { text-align: center; margin-top: 2rem; font-size: 0.72rem; color: var(--text-dim); }
  footer a { color: var(--text-dim); text-decoration: none; }
  footer a:hover { color: var(--cyan); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Calculator<br><span>Benzină</span></h1>
    <p>Prețuri live peco.ro · Distanță automată OpenStreetMap</p>
  </header>

  <div class="card">
    <div class="card-title">Rută</div>
    <div class="field">
      <label>Adresa A — Plecare</label>
      <input type="text" id="addrA" placeholder="ex: Florești, Cluj" autocomplete="off" />
    </div>
    <div class="field" style="margin-bottom:0;">
      <label>Adresa B — Destinație</label>
      <input type="text" id="addrB" placeholder="ex: Târgu Mureș" autocomplete="off" />
    </div>
    <div class="dist-row">
      <div class="dot" id="distDot"></div>
      <span class="dist-text" id="distText">Introdu ambele adrese</span>
      <span class="dist-val" id="distVal"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Consum</div>
    <div class="field" style="margin-bottom:0;">
      <label>Consum mașină (L/100km)</label>
      <input type="number" id="consumption" placeholder="ex: 7.5" min="1" step="0.1" />
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <div class="card-title">Preț combustibil</div>
      <button class="refresh-btn" onclick="loadPrices()">↻ Refresh</button>
    </div>
    <div class="fuel-status">
      <div class="dot loading" id="fuelDot"></div>
      <span class="fuel-label" id="fuelLabel">Se încarcă prețurile...</span>
    </div>
    <div class="fuel-grid" id="fuelGrid" style="display:none;"></div>
    <div class="field" style="margin-top:0.75rem;">
      <label>Sau introdu manual (RON/L)</label>
      <input type="number" id="manualPrice" placeholder="ex: 6.85" min="1" step="0.01" />
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <button class="btn-calc" onclick="calculate()">Calculează cost</button>

  <div class="result" id="result">
    <div class="result-label">Cost estimat total</div>
    <div class="result-main" id="resultCost">—</div>
    <div class="result-details">
      <div><div class="d-label">Distanță</div><div class="d-val" id="rDistanta">—</div></div>
      <div><div class="d-label">Consum</div><div class="d-val" id="rConsum">—</div></div>
      <div><div class="d-label">Litri necesari</div><div class="d-val" id="rLitri">—</div></div>
      <div><div class="d-label">Preț / litru</div><div class="d-val" id="rPret">—</div></div>
      <div><div class="d-label">Dus-întors</div><div class="d-val" id="rDusIntors">—</div></div>
      <div><div class="d-label">Sursă preț</div><div class="d-val" id="rSursa">—</div></div>
    </div>
  </div>

  <footer>
    <p>Prețuri via <a href="https://peco.ro" target="_blank">peco.ro</a> · Rute via <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a></p>
  </footer>
</div>

<script>
const WORKER_URL = 'https://fuel-prices.donceanstephan-media.workers.dev';
const NOMINATIM  = 'https://nominatim.openstreetmap.org/search';
const OSRM       = 'https://router.project-osrm.org/route/v1/driving';

let selectedPrice = null;
let selectedStation = null;
let calculatedDistance = null;
let debounceTimer = null;

async function geocode(q) {
  const r = await fetch(`${NOMINATIM}?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=ro`, {
    headers: { 'Accept-Language': 'ro', 'User-Agent': 'fuel-calculator/1.0' }
  });
  const d = await r.json();
  if (!d.length) throw new Error(`Adresă negăsită: "${q}"`);
  return { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) };
}

async function calcRoute() {
  const a = document.getElementById('addrA').value.trim();
  const b = document.getElementById('addrB').value.trim();
  if (!a || !b) return;

  const dot  = document.getElementById('distDot');
  const text = document.getElementById('distText');
  const val  = document.getElementById('distVal');

  dot.className = 'dot loading';
  text.textContent = 'Se calculează ruta...';
  val.textContent = '';
  calculatedDistance = null;

  try {
    const [cA, cB] = await Promise.all([geocode(a), geocode(b)]);
    const res = await fetch(`${OSRM}/${cA.lon},${cA.lat};${cB.lon},${cB.lat}?overview=false`);
    const data = await res.json();
    if (data.code !== 'Ok') throw new Error('Ruta nu a putut fi calculată');
    calculatedDistance = data.routes[0].distance / 1000;
    dot.className = 'dot ok';
    text.textContent = 'Distanță calculată';
    val.textContent = calculatedDistance.toFixed(1) + ' km';
  } catch(err) {
    dot.className = 'dot error';
    text.textContent = err.message;
    val.textContent = '';
  }
}

function onAddrInput() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(calcRoute, 900);
}

document.getElementById('addrA').addEventListener('input', onAddrInput);
document.getElementById('addrB').addEventListener('input', onAddrInput);

async function loadPrices() {
  const dot   = document.getElementById('fuelDot');
  const label = document.getElementById('fuelLabel');
  const grid  = document.getElementById('fuelGrid');

  dot.className = 'dot loading';
  label.textContent = 'Se încarcă prețurile...';
  grid.style.display = 'none';
  grid.innerHTML = '';
  selectedPrice = null;
  selectedStation = null;

  try {
    const res  = await fetch(WORKER_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.prices || !data.prices.length) throw new Error('Niciun preț');

    dot.className = 'dot ok';
    label.textContent = 'Live · ' + new Date().toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'});
    grid.style.display = 'grid';

    data.prices.forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'fuel-option' + (i === 0 ? ' selected' : '');
      el.innerHTML = `<div class="station">${item.station}</div><div class="price">${item.price.toFixed(2)} lei</div>`;
      el.onclick = () => {
        document.querySelectorAll('.fuel-option').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        selectedPrice = item.price;
        selectedStation = item.station;
      };
      grid.appendChild(el);
      if (i === 0) { selectedPrice = item.price; selectedStation = item.station; }
    });
  } catch(err) {
    dot.className = 'dot error';
    label.textContent = 'Eroare — folosește prețul manual';
    console.error(err);
  }
}

function calculate() {
  document.getElementById('errorMsg').className = 'error-msg';
  const cons   = parseFloat(document.getElementById('consumption').value);
  const manual = parseFloat(document.getElementById('manualPrice').value);

  if (!calculatedDistance) return showError('Introdu adresele pentru a calcula distanța.');
  if (!cons || cons <= 0)  return showError('Introdu consumul în L/100km.');

  let price = selectedPrice, sursa = selectedStation || '—';
  if (manual > 0) { price = manual; sursa = 'Manual'; }
  if (!price || price <= 0) return showError('Selectează un preț sau introdu manual.');

  const litri = (calculatedDistance / 100) * cons;
  const cost  = litri * price;

  document.getElementById('resultCost').textContent   = cost.toFixed(2) + ' RON';
  document.getElementById('rDistanta').textContent    = calculatedDistance.toFixed(1) + ' km';
  document.getElementById('rConsum').textContent      = cons.toFixed(1) + ' L/100km';
  document.getElementById('rLitri').textContent       = litri.toFixed(2) + ' L';
  document.getElementById('rPret').textContent        = price.toFixed(2) + ' RON/L';
  document.getElementById('rDusIntors').textContent   = (cost * 2).toFixed(2) + ' RON';
  document.getElementById('rSursa').textContent       = sursa;
  document.getElementById('result').className         = 'result show';
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.className = 'error-msg show';
}

loadPrices();
</script>
</body>
</html>
